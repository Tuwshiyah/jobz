<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
html,body,#m{margin:0;height:100%;background:#EDE8DF;font-family:system-ui,sans-serif}
.leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.7)!important;padding:1px 5px}
.leaflet-tile-pane{filter:saturate(.55) brightness(1.04)}
.pin{position:relative;width:46px;height:54px}
.pin .b{position:absolute;left:3px;top:3px;width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.22);background:#FFD9C2 center/cover;box-sizing:border-box;transition:transform .2s}
.pin .t{position:absolute;left:16px;top:41px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #fff}
.pin .r{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;border:2.5px solid #FF6A13;box-sizing:border-box}
.pin.sel .r{border-color:#141414}
.pin.sel .b{transform:scale(1.08)}
.pin .p{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:#141414;color:#fff;font:600 10.5px system-ui;padding:3px 7px;border-radius:999px;white-space:nowrap;display:none}
.pin.sel .p{display:block}
.me{width:18px;height:18px;border-radius:50%;background:#1E7BE6;border:3px solid #fff;box-shadow:0 0 0 8px rgba(30,123,230,.22)}
</style></head><body>
<div id="m"></div>
<script>
const map = L.map('m',{zoomControl:false, attributionControl:true}).setView([5.352,-3.99],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors', maxZoom:18}).addTo(map);
L.marker([5.352,-3.985],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false,zIndexOffset:-100}).addTo(map);
let markers = {}; let sel = null;
function render(pins){
  Object.values(markers).forEach(m=>map.removeLayer(m)); markers={};
  pins.forEach(p=>{
    const html = `<div class="pin ${p.id===sel?'sel':''}"><div class="r"></div><div class="b" style="background-image:url(${p.face})"></div><div class="t"></div><div class="p">${p.price}</div></div>`;
    const mk = L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html,iconSize:[46,54],iconAnchor:[23,52]}), zIndexOffset:p.id===sel?1000:0}).addTo(map);
    mk.on('click',()=>{ parent.postMessage({type:'jobz-map-select', id:p.id},'*'); });
    markers[p.id]=mk;
  });
}
let lastPins=[];
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type==='jobz-map-pins'){ lastPins=d.pins||[]; sel=d.sel||null; render(lastPins); if(d.fit && lastPins.length){ map.fitBounds(L.latLngBounds(lastPins.map(p=>[p.lat,p.lng])).pad(0.25),{maxZoom:13}); } if(sel){ const p=lastPins.find(p=>p.id===sel); if(p) map.panTo([p.lat,p.lng],{animate:true}); } }
  if(d.type==='jobz-map-center'){ map.flyTo([5.352,-3.985],13); }
});
parent.postMessage({type:'jobz-map-ready'},'*');
</script></body></html>
